<!doctype html>
<html lang="en" data-composition-variables='[{"id":"name","type":"string","label":"Name","default":"Made with HyperFrames"},{"id":"role","type":"string","label":"Second line","default":"composited by Remotion"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Archivo Black"; src: url("assets/fonts/ArchivoBlack-Regular.ttf") format("truetype"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      /* Transparent on purpose: this is a layer. `hyperframes render --format webm` keeps the alpha channel. */
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 1920px; height: 1080px; background: transparent; }
      #card { position: absolute; left: 120px; bottom: 140px; width: 980px; height: 210px; }
      #plate { position: absolute; inset: 0; background: rgba(15, 23, 42, 0.82); border-left: 14px solid #f97316; border-radius: 6px 24px 24px 6px; transform-origin: 0 50%; }
      #name { position: absolute; left: 60px; top: 38px; font-family: "Archivo Black", sans-serif; font-size: 64px; color: #f8fafc; white-space: nowrap; }
      #role { position: absolute; left: 62px; top: 128px; font-family: sans-serif; font-size: 38px; color: #fdba74; white-space: nowrap; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <div id="card" class="clip" data-start="0" data-duration="6" data-track-index="0">
        <div id="plate"></div>
        <div id="name" data-var-text="name">Made with HyperFrames</div>
        <div id="role" data-var-text="role">composited by Remotion</div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#plate", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power4.out" }, 0.2);
      tl.fromTo("#name", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 0.55);
      tl.fromTo("#role", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 0.75);
      tl.to(["#name", "#role"], { opacity: 0, duration: 0.35, ease: "power2.in" }, 5.1);
      tl.to("#plate", { scaleX: 0, duration: 0.45, ease: "power3.in" }, 5.4);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
